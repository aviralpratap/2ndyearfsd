<!DOCTYPE html>
<html>
<head>
    <title>Online Quiz</title>
    <link rel="stylesheet" href="assignment1.css">
</head>
<body>

<div class="container">

    <div class="header">
        <h1>Online Quiz</h1>
        <p>Test your knowledge</p>
    </div>

    <div id="studentForm" class="card">
        <h2>Student Details</h2>

        <input type="text" id="name" placeholder="Enter Name">
        <input type="text" id="branch" placeholder="Enter Branch">
        <input type="text" id="section" placeholder="Enter Section">
        <input type="text" id="roll" placeholder="Enter Roll Number">

        <button onclick="startQuiz()">Start Quiz</button>
    </div>

    <div id="quiz" class="card hidden">

        <div class="top">
            <h2>Quiz</h2>

            <div id="timer">
                30
            </div>
        </div>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <h2 id="question"></h2>

        <div id="options"></div>

        <button id="nextBtn" onclick="nextQuestion()">
            Next
        </button>

    </div>

    <div id="result" class="card hidden">

        <h1>Quiz Completed 🎉</h1>

        <h2 id="resultName"></h2>

        <div class="score">
            <span id="score">0</span>/5
        </div>

        <p>Attempted: <span id="attempted">0</span></p>
        <p>Correct: <span id="correct">0</span></p>
        <p>Wrong: <span id="wrong">0</span></p>
        <p>Unattempted: <span id="unattempted">0</span></p>

        <button onclick="location.reload()">
            Try Again
        </button>

    </div>

</div>

<script src="assignment1.js"></script>

</body>
</html>

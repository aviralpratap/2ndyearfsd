<!DOCTYPE html>
<html>
<body>

<script>

function calculateResult(m1, m2, m3, m4, m5) {
    let total = m1 + m2 + m3 + m4 + m5;
    let percentage = total / 5;

    let grade;

    if (percentage >= 90) {
        grade = "A";
    }
    else if (percentage >= 80) {
        grade = "B";
    }
    else if (percentage >= 70) {
        grade = "C";
    }
    else if (percentage >= 60) {
        grade = "D";
    }
    else {
        grade = "F";
    }

    document.write("Total Marks = " + total + "<br>");
    document.write("Percentage = " + percentage + "%<br>");
    document.write("Grade = " + grade);
}

let name = prompt("Enter student name:");
let roll = prompt("Enter roll number:");

let m1 = Number(prompt("Enter marks of Subject 1:"));
let m2 = Number(prompt("Enter marks of Subject 2:"));
let m3 = Number(prompt("Enter marks of Subject 3:"));
let m4 = Number(prompt("Enter marks of Subject 4:"));
let m5 = Number(prompt("Enter marks of Subject 5:"));

document.write("Student Name = " + name + "<br>");
document.write("Roll Number = " + roll + "<br><br>");

calculateResult(m1, m2, m3, m4, m5);

</script>

</body>
</html>
